# Base configuration for all profiles. Env vars are mapped explicitly, not by relaxed binding.
server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind a TLS-terminating proxy the app sees plain http, so absolute URLs it generates
  # (the / redirect, and the server URL the API docs advertise) would come out as http and a
  # browser would block them as mixed content. This makes it honour X-Forwarded-Proto.
  forward-headers-strategy: framework
  tomcat:
    max-connections: 25000               # hold a burst open while it queues
    accept-count: 1000
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: seat-reservation-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: seatres
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:60000}
      connection-init-sql: >-
        SET lock_timeout = '${DB_LOCK_TIMEOUT_MS:30000}ms';
        SET statement_timeout = '${DB_STATEMENT_TIMEOUT_MS:35000}ms';
        SET idle_in_transaction_session_timeout = '30000ms'
      data-source-properties:
        # A frozen or blackholed server answers nothing and closes nothing, so without a socket
        # read timeout every request waits forever. Above statement_timeout, so a server that is
        # merely slow still gets to cancel its own query first.
        socketTimeout: 60
        connectTimeout: 10
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-null-for-primitives: true
    mapper:
      allow-coercion-of-scalars: false
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

springdoc:
  show-actuator: true          # list the public health and metrics endpoints in the API docs

logging:
  structured:
    format:
      console: ecs

app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET}
    admin-key: ${APP_AUTH_ADMIN_KEY}
  idempotency:
    retention: ${APP_IDEMPOTENCY_RETENTION:PT24H}
  observability:
    pool:                                # separate pool for the seats gauge only
      maximum-pool-size: 2
      connection-timeout: 2000ms
      socket-timeout: 3s                 # just above the statement timeout below
      connection-init-sql: SET statement_timeout = '2000ms'

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true       # exposes /livez and /readyz
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
